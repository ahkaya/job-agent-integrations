name: Gmail Sync (Ansible)

on:
  schedule:
    - cron: '30 6-14 * * 1-5'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout job-agent-integrations
        uses: actions/checkout@v4

      - name: Checkout job-agent (core, for data module)
        uses: actions/checkout@v4
        with:
          repository: ahkaya/job-agent
          path: job-agent

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install ansible

      - name: Test GLM connectivity
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: |
          pip install openai
          python3 -c "import os; from openai import OpenAI; c = OpenAI(api_key=os.environ['GLM_API_KEY'], base_url='https://api.z.ai/api/paas/v4/'); r = c.chat.completions.create(model='glm-5.3-flash', messages=[{'role':'user','content':'hi'}], max_tokens=5); print('OK:', r.choices[0].message.content)"

      - name: Write GCP service account JSON
        run: |
          mkdir -p config
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > config/gcp_service_account.json

      - name: Run Ansible playbook
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: config/gcp_service_account.json
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          TURSO_SYNC_URL: ${{ secrets.TURSO_SYNC_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: ansible-playbook ansible/playbook.yml
